<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="./digital-stressball-favicon.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    <meta name="description" content="A high-tech interactive digital stress ball." />
    <title>The Digital Stress Ball</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="Interactive high-tech stress ball"></canvas>

    <main class="interface">
      <header>
        <div class="brand">
          <span class="brand-mark"></span>
          <span>DIGITAL BALL</span>
        </div>
        <button id="soundToggle" class="icon-button" aria-label="Toggle sound">SOUND ON</button>
      </header>

      <section class="hero-copy">
        <p class="eyebrow">TACTILE CALMING SYSTEM / 01</p>
        <h1>COMPRESS<br /><span>THE NOISE.</span></h1>
        <p class="instruction">Drag, press, and hold the energy core.</p>
      </section>

      <aside class="telemetry">
        <div class="telemetry-heading">
          <span>CORE TELEMETRY</span>
          <span class="live">LIVE</span>
        </div>
        <div class="metric">
          <div><span>PRESSURE</span><strong id="pressureValue">00%</strong></div>
          <div class="bar"><i id="pressureBar"></i></div>
        </div>
        <div class="metric compact">
          <span>STATE</span>
          <strong id="stateValue">STABLE</strong>
        </div>
        <div class="metric compact">
          <span>RELEASES</span>
          <strong id="releaseValue">000</strong>
        </div>
      </aside>

      <div class="mode-panel">
        <button class="mode active" data-theme="cyan">ION</button>
        <button class="mode" data-theme="violet">VOID</button>
        <button class="mode" data-theme="amber">SOLAR</button>
      </div>

      <footer>
        <span>WEBGL // SOFT-BODY SIMULATION</span>
        <span id="fps">60 FPS</span>
      </footer>
    </main>

    <div id="flash" class="flash"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
